<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3400 3400" width="3400" height="3400">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Exterior Wall Footprint -->
  <rect id="outer_footprint" x="100.00" y="100.00" width="3200.00" height="3200.00" fill="#f4f4f6" stroke="#111111" stroke-width="40.00"/>
  <!-- Interior Usable Boundary -->
  <rect id="inner_boundary" x="140.00" y="140.00" width="3120.00" height="3120.00" fill="#fafafa" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- South Entrance Doorway (0.90m) -->
  <rect id="entrance_threshold" x="1655.00" y="3280.00" width="90.00" height="40.00" fill="#ffffff" stroke="none"/>
  <!-- Door Swing Arc (0.95m clearance) -->
  <path id="entrance_door_arc" d="M 1655.00 3300.00 A 90.0 90.0 0 0 1 1745.00 3210.00" fill="none" stroke="#0066cc" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1655.00" y1="3300.00" x2="1655.00" y2="3210.00" stroke="#0066cc" stroke-width="2"/>
  <!-- Dimensions Legend -->
  <text x="100.00" y="80.00" font-family="monospace" font-size="24" fill="#333333">32.00m</text>
  <text x="3320.00" y="1700.00" font-family="monospace" font-size="24" fill="#333333" transform="rotate(90 3320.0 1700.0)">32.00m</text>
</svg>