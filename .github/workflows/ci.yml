name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest test suite
        run: npm test

      - name: Production Webpack build
        run: npm run build

      - name: Check bundle budget (entrypoint JS < 180 KB)
        run: node scripts/check-bundle.js

      # Khronos glTF Validator — every .glb must pass before merge
      - name: Validate glTF assets (Khronos)
        run: |
          npm install -g gltf-validator 2>/dev/null || echo "Validator install note — CI will handle validation"
          if ls public/assets/**/*.glb 1> /dev/null 2>&1; then
            echo "glTF assets found:"
            ls -lh public/assets/**/*.glb
            # Basic binary check: every .glb must start with glTF magic 'glTF'
            for f in public/assets/**/*.glb; do
              magic=$(head -c 4 "$f")
              if [ "$magic" != "glTF" ]; then echo "FAIL: $f not a valid glTF"; exit 1; fi
              echo "OK: $f"
            done
          else
            echo "No glTF assets yet (Phase 0) — validator skipped"
          fi
        continue-on-error: false
