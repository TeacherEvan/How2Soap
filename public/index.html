<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Emergent chemistry and survival engine — make soap from scratch. Real thermodynamics, Arrhenius kinetics and phase transitions in a hand-built browser engine."
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta property="og:title" content="How2Soap" />
    <meta
      property="og:description"
      content="Emergent chemistry and survival engine — make soap from scratch."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>How2Soap</title>
  </head>
  <body>
    <!-- Full-viewport World Base Layer -->
    <div id="world" class="world-viewport" aria-hidden="false"></div>

    <div id="app" class="game-shell">
      <!-- Persistent Chrome: 3 elements only (Spec 1 §4.1) -->
      <!-- 1. Top-Left: New World Button -->
      <button id="reset" class="fab-new-world" type="button" aria-label="Start a new world (↺)" title="Start a new world">
        ↺
      </button>

      <!-- 2. Top-Right: Council Menu FAB -->
      <button id="btn-council-menu" class="fab-menu" type="button" aria-label="Open Council Chamber (Esc or M)" title="Council Chamber (M / Esc)">
        <span class="fab-menu-icon" aria-hidden="true">☰</span>
        <span class="fab-menu-label">Council</span>
        <span class="fab-attention-badge" id="council-attention-badge" style="display: none;"></span>
      </button>

      <!-- 3. Bottom-Right: End Turn FAB -->
      <button id="end-turn" class="fab-end-turn primary" type="button" aria-label="End Turn (Space or Enter)" title="End Turn (Space / Enter)">
        <span class="fab-turn-label">End Turn ▸</span>
        <span class="fab-turn-caption" id="turn-caption">Day 1 · 06:00</span>
      </button>

      <!-- Politeness announcement surface for toasts / alerts -->
      <div class="banners" id="banners" aria-live="polite"></div>

      <!-- Hidden telemetry and compatibility targets for background state broadcasts -->
      <div style="display: none;" aria-hidden="true">
        <span id="isolation"></span>
        <span id="clock"></span>
        <span id="p-glucose"></span>
        <span id="p-temp"></span>
        <span id="p-iclo"></span>
        <span id="val-adipose"></span>
        <span id="val-hydration"></span>
        <span id="val-ambient"></span>
        <span id="val-health"></span>
        <span id="val-safety"></span>
        <span id="val-vigor"></span>
        <span id="val-mandate"></span>
        <span id="val-renown-title"></span>
        <button id="skip-turns"></button>
        <button id="dawn-report"></button>
        <div id="vessel-list"></div>
        <div id="biome-panel-container"></div>
        <ul id="log"></ul>
        <ul id="quest"></ul>
      </div>
    </div>
  </body>
</html>
